# Linux quality gate for PRs and protected branches.
# Executable builds stay local; PyPI/GitHub Release stays in publish.yml.
name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install project dependencies
        run: |
          poetry config virtualenvs.in-project true --local
          poetry lock
          poetry install --extras dev --sync

      - name: Ruff check
        run: .venv/bin/ruff check src tests scripts

      - name: Ruff format
        run: .venv/bin/ruff format --check src tests scripts

      - name: Mypy
        run: .venv/bin/mypy

      - name: Pytest
        run: .venv/bin/pytest
