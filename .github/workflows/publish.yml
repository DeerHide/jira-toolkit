# Publish jira-toolkit to PyPI and optionally create a GitHub Release.
# Triggers: JT_* tags (e.g. JT_1.3.0) or manual workflow_dispatch.
#
# PyPI Trusted Publisher:
#   Owner: DeerHide
#   Repository: jira-toolkit
#   Workflow name: publish.yml
#   Environment: pypi
name: Publish

on:
  push:
    tags:
      - "JT_[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Publish distributions to PyPI
        type: boolean
        default: true
      create_github_release:
        description: Create/update GitHub Release when the ref is a JT_* tag
        type: boolean
        default: true

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing (OIDC)
      contents: write # GitHub Release assets

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Resolve version label
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == JT_* ]]; then
            VERSION="${GITHUB_REF_NAME#JT_}"
            IS_JT_TAG=true
          else
            # Branch dispatch: fall back to pyproject.toml [project].version
            VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            IS_JT_TAG=false
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_jt_tag=${IS_JT_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} is_jt_tag=${IS_JT_TAG}"

      - name: Build package distributions (wheel + sdist only)
        # Avoid `poetry build` so the PyInstaller plugin does not run.
        run: python -m build

      - name: Extract changelog for release notes
        id: changelog
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES_FILE=release_notes.txt

          if [[ ! -f CHANGELOG.md ]]; then
            echo "CHANGELOG.md missing — using placeholder notes."
            {
              echo "Release ${VERSION}"
              echo
              echo "Add a root CHANGELOG.md for richer release notes."
            } > "${NOTES_FILE}"
            echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          awk -v ver="${VERSION}" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' \
            > "${NOTES_FILE}"

          if [[ ! -s "${NOTES_FILE}" ]]; then
            echo "No section ## [${VERSION}] in CHANGELOG.md — using placeholder."
            {
              echo "Release ${VERSION}"
              echo
              echo "No matching CHANGELOG.md section found for this version."
            } > "${NOTES_FILE}"
          fi

          echo "Extracted release notes for ${VERSION}:"
          cat "${NOTES_FILE}"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: >-
          steps.meta.outputs.is_jt_tag == 'true' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.create_github_release))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: |
            dist/jira_toolkit-*.tar.gz
            dist/jira_toolkit-*.whl
          prerelease: false
          generate_release_notes: false

      - name: Publish package distributions to PyPI
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
        uses: pypa/gh-action-pypi-publish@release/v1
